<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">BreakPoint FRC · Team 12050</title>
  <desc id="d">A rookie FIRST Robotics Competition team from Bursa, Türkiye, est. 2026</desc>
  <defs>
    <pattern id="stripes" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="14" height="28" fill="#FF2E88"/>
    </pattern>
    <linearGradient id="word" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="670" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FF2E88"/>
    </linearGradient>
    <style>
      .h { font: 900 92px 'Arial Black', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; }
      .s { font: 700 26px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 6px; }
      .p { font: 800 22px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; }
      .m { font: 500 20px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
      .slide { animation: slide 6s linear infinite; }
      @keyframes slide { to { transform: translateX(-56px); } }
    </style>
    <clipPath id="band"><polygon points="950,0 1200,0 1200,360 830,360"/></clipPath>
    <clipPath id="card"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
  <rect width="1200" height="360" fill="#0B0B0F"/>
  <g clip-path="url(#band)">
    <rect class="slide" x="760" y="0" width="520" height="360" fill="url(#stripes)" opacity="0.9"/>
  </g>
  <polygon points="950,0 990,0 870,360 830,360" fill="#FFD60A"/>

  <rect x="64" y="64" width="250" height="44" rx="22" fill="#FFD60A"/>
  <text x="189" y="94" text-anchor="middle" class="p" fill="#0B0B0F">FRC · TEAM 12050</text>

  <text x="60" y="210" class="h" fill="url(#word)">BREAKPOINT</text>

  <text x="64" y="258" class="s" fill="#FFD60A">BUILD · BREAK · LEARN · REPEAT</text>
  <text x="64" y="304" class="m" fill="#FFFFFF" opacity="0.75">Rookie FIRST Robotics Competition team · Bursa, Türkiye · est. 2026</text>

  <rect x="0" y="350" width="1200" height="10" fill="url(#glow)"/>
  </g>
</svg>
