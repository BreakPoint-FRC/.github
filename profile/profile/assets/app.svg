<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">FRC Management is live</title>
  <desc id="d">The platform we built to run our season, now open to every FRC team. app.breakpointfrc.com</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="28"/></clipPath>
    <style>
      .k { font: 800 18px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 4px; }
      .h { font: 900 64px 'Arial Black', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; }
      .b { font: 500 22px 'Helvetica Neue', Arial, sans-serif; }
      .u { font: 700 22px 'Courier New', monospace; }
      .dot { animation: pulse 1.6s ease-in-out infinite; transform-origin: 84px 66px; }
      @keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#FFD60A"/>
    <rect x="0" y="0" width="14" height="300" fill="#FF2E88"/>
  </g>

  <circle class="dot" cx="84" cy="66" r="9" fill="#FF2E88"/>
  <text x="104" y="73" class="k" fill="#0B0B0F">NOW LIVE</text>

  <text x="64" y="150" class="h" fill="#0B0B0F">FRC Management</text>
  <text x="64" y="196" class="b" fill="#0B0B0F">The platform we built to run our own season — now open to every FRC team.</text>

  <rect x="64" y="222" width="360" height="48" rx="24" fill="#0B0B0F"/>
  <text x="244" y="253" text-anchor="middle" class="u" fill="#FFFFFF">app.breakpointfrc.com</text>

  <g transform="translate(920,40)">
    <rect width="220" height="220" rx="26" fill="#0B0B0F"/>
    <rect x="24" y="28" width="120" height="14" rx="7" fill="#FF2E88"/>
    <rect x="24" y="58" width="172" height="10" rx="5" fill="#FFFFFF" opacity=".85"/>
    <rect x="24" y="78" width="140" height="10" rx="5" fill="#FFFFFF" opacity=".55"/>
    <rect x="24" y="112" width="52" height="84" rx="8" fill="#FFD60A"/>
    <rect x="84" y="136" width="52" height="60" rx="8" fill="#FF2E88"/>
    <rect x="144" y="96" width="52" height="100" rx="8" fill="#FFFFFF"/>
  </g>
</svg>
